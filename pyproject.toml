[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elimination-search-cv"
version = "0.0.1"
authors = [
  { name = "Thisal-D" }
]

license = "MIT"
license-files = ["LICENSE"]

description = "A Scikit-Learn compatible hyperparameter search that eliminates low-scoring parameter values progressively — faster than GridSearchCV on large grids."
readme = "README.md"
requires-python = ">=3.8"

# Runtime dependencies — installed automatically when the user runs `pip install elimination-search-cv`
dependencies = [
  "scikit-learn>=1.0",
  "numpy>=1.21",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = [
  "hyperparameter",
  "hyperparameter-search",
  "hyperparameter-tuning",
  "hyperparameter-optimization",
  "grid-search",
  "scikit-learn",
  "sklearn",
  "machine-learning",
  "cross-validation",
  "elimination",
  "model-selection",
  "model-tuning",
  "model-optimization"
]

[project.urls]
Homepage     = "https://github.com/thisal-d/elimination-search-cv"
Repository   = "https://github.com/thisal-d/elimination-search-cv"
Issues       = "https://github.com/thisal-d/elimination-search-cv/issues"
Changelog    = "https://github.com/thisal-d/elimination-search-cv/blob/main/CHANGELOG.md"
Documentation = "https://github.com/thisal-d/elimination-search-cv/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]